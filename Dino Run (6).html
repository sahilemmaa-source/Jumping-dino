<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dino Run</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ffffff">
<style>
:root{color-scheme:light;--k:#141413;--sky:#d9ecff;--mint:#d8f5e5;--peach:#ffe7d3;--lav:#ebe3ff;--sun:#ffeaa8;--rose:#ffdde8;font-family:system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--k);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}

canvas.pt,canvas.ic,#over canvas,#hud canvas,#toast{image-rendering:pixelated;display:block}
#app{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;gap:10px;pointer-events:none;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 0 calc(12px + env(safe-area-inset-left,0px))}

.ib{width:48px;height:48px;border-radius:50%;border:3px solid var(--k);background:#fff;display:grid;place-items:center}
#bh{background:var(--peach)}#bc{background:var(--sky)}#bs{background:var(--mint)}
#hud{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));z-index:4;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}

#retry:active{transform:scale(.95)}

#app:not([data-p=""]) #scrim{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 16px));height:var(--sh,40vh);max-height:94%;display:flex;flex-direction:column;background:#fff;border:3px solid var(--k);border-radius:36px;box-shadow:0 18px 50px rgba(0,0,0,.18);transform:translate(-50%,125%);transition:transform .38s cubic-bezier(.2,.85,.25,1),height .22s ease;z-index:20;overflow:hidden}
.sheet.dg{transition:none}
#app[data-p=set] #set,#app[data-p=help] #help,#app[data-p=shr] #shr,#app[data-p=sug] #sug,#app[data-q=pf] #pf{transform:translate(-50%,0)}
.hd,.hd2{position:relative;flex:none;height:64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;touch-action:none;cursor:grab}
.gp{position:absolute;top:9px;left:50%;width:46px;height:5px;margin-left:-23px;border-radius:3px;background:#d3d3ce}
.x{position:absolute;top:16px;width:38px;height:38px;display:grid;place-items:center}
#help .x{right:16px}#set .x,#shr .x,#sug .x,#lb .x,#pf .x{left:16px}
.bd{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;padding:2px 18px 22px}
.cd{display:grid;grid-template-columns:42% 1fr;gap:14px;align-items:center;padding:10px;margin:9px 0;border-radius:24px;background:var(--bg);border:2.5px solid var(--k)}
.cd div{display:grid;gap:8px;min-width:0}
.dm{width:100%;height:auto;aspect-ratio:230/120;border-radius:16px;border:2.5px solid var(--k);background:#fff;image-rendering:pixelated;display:block}
#hint{position:absolute;left:50%;bottom:9px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--k);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s;animation:bn 1.5s ease-in-out infinite}

.rw{display:flex;justify-content:space-between;align-items:center;padding:20px 4px 8px}
#sl{position:relative;height:82px;margin:6px 8px 10px;touch-action:none}

#pv{flex:1;min-height:0;display:flex;align-items:center;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x;scrollbar-width:none;padding:4px 14px 10px}

.ab{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 20px 18px}

#me{display:flex;align-items:center;gap:12px;margin:0 14px 8px;padding:12px;border:3px solid var(--k);border-radius:24px;background:var(--lav);flex:none}

.lr{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:2.5px dashed #e4e4de}

.dots{display:flex;gap:10px;justify-content:center;padding:44px}.dots i{width:12px;height:12px;background:var(--k);animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-12px);opacity:1}}
#pfs{position:fixed;inset:0;z-index:35;background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}

</style></head><body>

<script>
'use strict';
(()=>{
const $=s=>document.querySelector(s),KB='dino-run.best.v5',KR='dino-run.session.v2',KP='dino-run.prefs.v2';

const BODY=[".........######.","........##.#####","........########","........########","........########","........#####...","#......########.","##....######....","###..#######....","##############..","############.#..",".###########....","..#########.....","...#######......"];

function mkAv(u){const d=document.createElement('div');d.className='av';if(u.id===PR.id&&PR.photo)d.style.backgroundImage='url('+PR.photo+')';else if(u.av)d.style.backgroundImage='url(api/av/'+u.id+'?v='+(u.v||0)+')';else{d.style.background='hsl('+(parseInt(String(u.id).slice(0,4),16)%360)+' 70% 85%)';d.style.display='grid';d.style.placeItems='center';const c=document.createElement('canvas');ic(c,'face',2,'#141413');d.appendChild(c)}return d}
function lrow(u,rank){const r=document.createElement('div');r.className='lr'+(u.id===PR.id?' me':'');const rk=document.createElement('div');rk.className='rk';const c=document.createElement('canvas');if(rank<=3)ic(c,'medal',3,['#f2b705','#aeb4bd','#a8764b'][rank-1]);else ptx(c,String(rank),2,'#141413',0);rk.appendChild(c);const nm=document.createElement('div');nm.className='nm';const n1=document.createElement('canvas');ptx(n1,u.name,2,'#141413',0);nm.appendChild(n1);const tt=document.createElement('canvas');ptx(tt,String(u.total),2,'#4a4a46',0);r.append(rk,mkAv(u),nm,tt);return r}
function lbRender(){const L=$('#ll'),sig=lbS+'|'+JSON.stringify(LBD&&LBD.list.map(u=>[u.id,u.name,u.total,u.v]))+'|'+PR.name+PR.total+PR.photo.length;if(sig===LBS)return;LBS=sig;const keep=L.scrollTop;L.textContent='';
$('#mav').style.backgroundImage=PR.photo?'url('+PR.photo+')':'';ptx($('#mnm'),PR.name,3,'#141413',0);ptx($('#mtt'),'SCORE '+PR.total,2,'#4a4a46',0);
const dots=()=>{const d=document.createElement('div');d.className='dots';d.innerHTML='<i></i><i></i><i></i>';L.appendChild(d)};
if(lbS===0){dots();return}
if(lbS===2){const c=document.createElement('canvas');ptx(c,'OFFLINE',2,'#8a8a84',0);c.style.cssText='display:block;margin:8px auto';L.appendChild(c);L.appendChild(lrow({id:PR.id,name:PR.name,total:PR.total,av:0},1));return}
if(!LBD.list.length){dots();return}
LBD.list.forEach((u,i)=>L.appendChild(lrow(u,i+1)));L.scrollTop=keep}
async function lbLoad(){try{LBD=await api('api/top?n=100');lbS=1}catch(e){if(!LBD)lbS=2}lbRender()}
function openLB(){pause();pixAll();LBS='';lbS=LBD?1:0;lbRender();app.dataset.p='lb';lbLoad();clearInterval(LBT);LBT=setInterval(()=>{if(app.dataset.p==='lb')lbLoad();else clearInterval(LBT)},5000)}
$('#lbb').onclick=openLB;
const pc=$('#pc'),pg=pc.getContext('2d'),pz=$('#pz'),pn=$('#pn'),pfi=$('#pfi');let PE={img:null,s:1,x:0,y:0,b:1},pd0=null;
const pClamp=()=>{if(!PE.img)return;const w=PE.img.width*PE.b*PE.s,h=PE.img.height*PE.b*PE.s,mx=Math.max(0,(w-212)/2),my=Math.max(0,(h-212)/2);PE.x=Math.max(-mx,Math.min(mx,PE.x));PE.y=Math.max(-my,Math.min(my,PE.y))};
function pDraw(){pg.clearRect(0,0,220,220);pg.fillStyle='#eee';pg.fillRect(0,0,220,220);if(PE.img){const w=PE.img.width*PE.b*PE.s,h=PE.img.height*PE.b*PE.s;pg.drawImage(PE.img,110-w/2+PE.x,110-h/2+PE.y,w,h)}pg.save();pg.globalCompositeOperation='destination-in';pg.beginPath();pg.arc(110,110,106,0,7);pg.fill();pg.restore();pg.strokeStyle='#141413';pg.lineWidth=5;pg.beginPath();pg.arc(110,110,106,0,7);pg.stroke()}
pc.addEventListener('pointerdown',e=>{pd0={x:e.clientX,y:e.clientY};try{pc.setPointerCapture(e.pointerId)}catch(_){}});
pc.addEventListener('pointermove',e=>{if(!pd0||!PE.img)return;PE.x+=(e.clientX-pd0.x)*220/pc.clientWidth;PE.y+=(e.clientY-pd0.y)*220/pc.clientHeight;pd0={x:e.clientX,y:e.clientY};pClamp();pDraw()});
pc.addEventListener('pointerup',()=>pd0=null);pc.addEventListener('pointercancel',()=>pd0=null);
pz.oninput=()=>{PE.s=+pz.value;pClamp();pDraw()};$('#pph').onclick=()=>pfi.click();
const loadPE=(src,rev)=>{const im=new Image();im.onload=()=>{PE.img=im;PE.b=Math.max(212/im.width,212/im.height);PE.s=1;PE.x=PE.y=0;pz.value=1;pDraw();if(rev)URL.revokeObjectURL(src)};im.src=src};
pfi.onchange=()=>{const f=pfi.files[0];if(f)loadPE(URL.createObjectURL(f),1);pfi.value=''};
function openPF(){pixAll();pn.value=PR.name;PE={img:null,s:1,x:0,y:0,b:1};pz.value=1;if(PR.photo)loadPE(PR.photo);pDraw();app.dataset.q='pf'}
const closeQ=()=>{app.dataset.q=''};
$('#pe').onclick=openPF;$('#pf .x').onclick=closeQ;$('#pfs').addEventListener('pointerdown',closeQ);$('#zm .x').onclick=zClose;
$('#psv').onclick=()=>{const nm=pn.value.replace(/^@+/,'').toLowerCase().replace(/[^a-z0-9_.]/g,'').slice(0,16);if(nm.length<3){toast('Name too short');return}PR.name='@'+nm;
if(PE.img){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),k=128/212,w=PE.img.width*PE.b*PE.s*k,h=PE.img.height*PE.b*PE.s*k;g.drawImage(PE.img,64-w/2+PE.x*k,64-h/2+PE.y*k,w,h);PR.photo=c.toDataURL('image/jpeg',.82)}
PR.pd=1;PRsave();LBS='';lbRender();syncPR();closeQ()};
document.querySelectorAll('#sg button').forEach(b=>b.onclick=()=>{P.th=+b.dataset.t;prefs();tint();sync();closeP();go();since=0;gap=620});

let ori=innerWidth>=innerHeight;

addEventListener('resize',onSize);addEventListener('orientationchange',()=>setTimeout(onSize,150));
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();save()}});
addEventListener('pagehide',()=>{pause();save()});
try{history.replaceState({g:0},'');history.pushState({g:1},'')}catch(e){}
addEventListener('popstate',()=>{pause();save();try{history.pushState({g:1},'')}catch(e){}});
setInterval(()=>{if(st==='run')save()},2500);
P.zoom=[.85,1,1.2].reduce((a,b)=>Math.abs(b-P.zoom)<Math.abs(a-P.zoom)?b:a);size();restore();sync();requestAnimationFrame(frame);syncPR();try{if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
