<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dino Run</title>
<style>
:root{color-scheme:light;--k:#141413;--sky:#d9ecff;--mint:#d8f5e5;--peach:#ffe7d3;--lav:#ebe3ff;--sun:#ffeaa8;--rose:#ffdde8;font-family:system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--k);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;padding:0;background:none;border:0}
canvas.pt,canvas.ic,#over canvas,#hud canvas,#toast{image-rendering:pixelated;display:block}
#app{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;gap:10px;pointer-events:none;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 0 calc(12px + env(safe-area-inset-left,0px))}
#bar button{pointer-events:auto}#bar .sp{flex:1}
#app[data-st=home] #bar{display:none}
.ib{width:48px;height:48px;border-radius:50%;border:3px solid var(--k);background:#fff;display:grid;place-items:center}
#bh{background:var(--peach)}#bc{background:var(--sky)}#bs{background:var(--mint)}
#hud{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(68px + env(safe-area-inset-top,0px));z-index:4;pointer-events:none}
#app[data-st=home] #hud{top:calc(16px + env(safe-area-inset-top,0px))}
#hud.fl{animation:fl .6s}@keyframes fl{25%,75%{opacity:.12}}
#tut{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:50%;margin-top:-29px;width:58px;height:58px;border-radius:50%;border:3px solid var(--k);background:linear-gradient(145deg,#ffe9a8,#ffc86b);display:none;place-items:center;z-index:7;box-shadow:0 4px 0 var(--k)}
#app[data-st=home] #tut{display:grid}#tut:active{transform:translateY(3px);box-shadow:0 1px 0 var(--k)}
#play{position:fixed;inset:0;z-index:6;display:none;place-items:center;background:rgba(255,255,255,.5)}
#app[data-st=pause] #play{display:grid}#app:not([data-p=""]) #play{display:none}
#over{position:fixed;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4.5vh,38px);background:rgba(255,255,255,.62)}
#app[data-st=over] #over{display:flex}
#retry:active{transform:scale(.95)}
#scrim{position:fixed;inset:0;z-index:15;background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);opacity:0;pointer-events:none;transition:opacity .3s}
#app:not([data-p=""]) #scrim{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 16px));height:var(--sh,40vh);max-height:94%;display:flex;flex-direction:column;background:#fff;border:3px solid var(--k);border-radius:36px;box-shadow:0 18px 50px rgba(0,0,0,.18);transform:translate(-50%,125%);transition:transform .38s cubic-bezier(.2,.85,.25,1),height .22s ease;z-index:20;overflow:hidden}
.sheet.dg{transition:none}
#app[data-p=set] #set,#app[data-p=help] #help,#app[data-p=shr] #shr{transform:translate(-50%,0)}
.hd{position:relative;flex:none;height:64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;touch-action:none;cursor:grab}
.gp{position:absolute;top:9px;left:50%;width:46px;height:5px;margin-left:-23px;border-radius:3px;background:#d3d3ce}
.x{position:absolute;top:16px;width:38px;height:38px;display:grid;place-items:center}
#help .x{right:16px}#set .x,#shr .x{left:16px}
.bd{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;padding:2px 18px 22px}
.cd{display:grid;grid-template-columns:42% 1fr;gap:14px;align-items:center;padding:10px;margin:9px 0;border-radius:24px;background:var(--bg);border:2.5px solid var(--k)}
.cd div{display:grid;gap:8px;min-width:0}
.dm{width:100%;height:auto;aspect-ratio:230/120;border-radius:16px;border:2.5px solid var(--k);background:#fff;image-rendering:pixelated;display:block}
#hint{position:absolute;left:50%;bottom:9px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--k);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s;animation:bn 1.5s ease-in-out infinite}
#hint.on{opacity:.92}@keyframes bn{50%{transform:translateY(4px)}}
.rw{display:flex;justify-content:space-between;align-items:center;padding:20px 4px 8px}
#sl{position:relative;height:82px;margin:6px 8px 10px;touch-action:none}
#sl .tk{position:absolute;left:17px;right:17px;top:22px;height:6px;border-radius:3px;background:#e6e6e2}
#sl button{position:absolute;top:8px;width:34px;height:34px;border-radius:50%;border:3px solid #d3d3ce;background:#fff}
#sl button:nth-of-type(1){left:0}#sl button:nth-of-type(2){left:calc(50% - 17px)}#sl button:nth-of-type(3){right:0}
#sl .th{position:absolute;top:8px;width:34px;height:34px;border-radius:50%;background:var(--k);left:calc((100% - 34px) * var(--p,1) / 2);transition:left .2s;pointer-events:none}
#sl .l,#sl .r{position:absolute;top:56px}#sl .l{left:2px}#sl .r{right:2px}
#rot{width:78px;height:42px;border-radius:999px;border:3px solid #e06666;background:#f7c9c9;position:relative}
#rot b{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#e06666;transition:transform .18s,background .18s}
#rot[aria-checked=true]{border-color:#4fb26f;background:#c5efd3}#rot[aria-checked=true] b{background:#4fb26f;transform:translateX(36px)}
#th{display:flex;justify-content:space-between;gap:10px;padding:6px 4px 12px}
#th button{flex:1;max-width:56px;aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d3d3ce;background:conic-gradient(var(--a) 0 33.4%,var(--b) 0 66.7%,var(--c) 0)}
#th button.on{box-shadow:0 0 0 3px var(--k)}
#pv{flex:1;min-height:0;display:flex;align-items:center;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x;scrollbar-width:none;padding:4px 14px 10px}
#pv::-webkit-scrollbar{display:none}
#pv img{flex:none;height:100%;aspect-ratio:.8;object-fit:cover;scroll-snap-align:center;border-radius:24px;border:3px solid var(--k);background:#fff;opacity:0;transform:scale(.6);transition:transform .5s cubic-bezier(.2,.85,.25,1),opacity .35s}
#pv.on img{opacity:1;transform:none}#pv.on img:nth-child(1),#pv.on img:nth-child(3){transition-delay:.25s}
.ab{flex:none;display:flex;justify-content:space-between;padding:6px 20px 18px}
.cb{width:80px;height:56px;border-radius:999px;border:3px solid var(--k);display:grid;place-items:center}
#shk{background:#c5efd3}#shs{background:#cfe3ff}.cb:active{transform:scale(.95)}
#zm{position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:none;place-items:center}
#zm.on{display:grid}#zm img{max-width:92%;max-height:92%;border-radius:28px;border:3px solid var(--k);object-fit:contain;animation:zi .25s ease}@keyframes zi{from{transform:scale(.85);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);padding:11px 18px;border:2.5px solid #1d5bd6;border-radius:999px;background:#fff;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-sizing:content-box}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>

<div class="bd" id="hb">

<article class="cd" style="--bg:var(--mint)"><canvas class="dm" width="460" height="240"></canvas><div><canvas class="pt" data-t="Camera" data-k="3"></canvas><canvas class="pt" data-w="1" data-t="Tap the camera for three photos. Save them or share." data-k="2" data-c="#4a4a46"></canvas></div></article>
<article class="cd" style="--bg:var(--sun)"><canvas class="dm" width="460" height="240"></canvas><div><canvas class="pt" data-t="Settings" data-k="3"></canvas><canvas class="pt" data-w="1" data-t="Slide the size. Set rotate. Pick a colour set." data-k="2" data-c="#4a4a46"></canvas></div></article>
<article class="cd" style="--bg:var(--rose)"><canvas class="dm" width="460" height="240"></canvas><div><canvas class="pt" data-t="Music" data-k="3"></canvas><canvas class="pt" data-w="1" data-t="Lift the dino into the sky. Music and weather begin." data-k="2" data-c="#4a4a46"></canvas></div></article></div>
<div id="hint"><canvas class="ic" data-i="chev" data-k="2" data-c="#ffffff"></canvas></div></section>

<div id="pv"><img alt="Before" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><img alt="Now" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><img alt="After" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></div>
<p id="shc" hidden></p><p id="shl" hidden></p>
<div class="ab"><button class="cb" id="shk" aria-label="Save photos"><canvas class="ic" data-i="ok" data-k="3" data-c="#1f7a45"></canvas></button><button class="cb" id="shs" aria-label="Share"><canvas class="ic" data-i="shr" data-k="3" data-c="#1d4fb8"></canvas></button></div></section>
<div id="zm"><img id="zmi" alt="Photo"></div>
<canvas id="toast"></canvas>
</main>
<script>
'use strict';
(()=>{
const $=s=>document.querySelector(s),KB='dino-run.best.v5',KR='dino-run.session.v2',KP='dino-run.prefs.v2';
const ST={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},d:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let P={zoom:1,rot:1,cap:0,th:0,trk:0};try{Object.assign(P,JSON.parse(ST.g(KP)||'{}'))}catch(e){}
let hi=Math.max(0,parseInt(ST.g(KB))||0);
const app=$('#app'),cv=$('#c'),cx=cv.getContext('2d',{alpha:false}),hudEl=$('#hud'),hudCv=hudEl.firstElementChild;
/* ---------- sprites: one grid cell = one world unit; masks double as collision pixels ---------- */
const FONT='"FK Grotesk Neue","FK Grotesk",Manrope,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const fin=(o,k=[20,20,19])=>{const c=document.createElement('canvas');c.width=o.w;c.height=o.h;const g=c.getContext('2d'),d=g.createImageData(o.w,o.h);for(let i=0;i<o.m.length;i++)if(o.m[i]){d.data[i*4+3]=255;d.data[i*4]=k[0];d.data[i*4+1]=k[1];d.data[i*4+2]=k[2]}g.putImageData(d,0,0);o.c=c;return o};
const rows=(r,w)=>{const h=r.length,m=new Uint8Array(w*h);r.forEach((s,j)=>{for(let i=0;i<s.length;i++)if(s[i]==='#')m[j*w+i]=1});return{w,h,m}};
const rects=(w,h,fn)=>{const m=new Uint8Array(w*h);fn((x,y,a,b)=>{for(let j=y;j<y+b;j++)for(let i=x;i<x+a;i++)if(i>=0&&i<w&&j>=0&&j<h)m[j*w+i]=1});return{w,h,m}};
const BODY=[".........######.","........##.#####","........########","........########","........########","........#####...","#......########.","##....######....","###..#######....","##############..","############.#..",".###########....","..#########.....","...#######......"];
const LA=["....###.##......","....##...#......","....#....##.....","....##.........."],LB=["....###.##......",".....##.##......","......#..##.....","........##......"];
const up2=r=>r.flatMap(s=>{const t=[...s].map(c=>c+c).join('');return[t,t]});
const squash=s=>{const w=44,h=22,m=new Uint8Array(w*h);for(let j=0;j<h;j++)for(let i=0;i<w;i++)m[j*w+i]=s.m[((j*s.h/h)|0)*s.w+((i*s.w/w)|0)];return{w,h,m}};
const dn=l=>rows(up2(BODY.concat(l)),32);
const G=(f,k)=>(x,y,a,b)=>f(Math.round(x*k),Math.round(y*k),Math.round(a*k),Math.round(b*k));
const cact=(f,x,h,l,r)=>{f(x+5,0,5,h);if(l>=0){f(x+1,l,4,8);f(x+1,l+5,6,3)}if(r>=0){f(x+11,r,4,8);f(x+9,r+5,5,3)}};
const crow=n=>{const s=rects(36,26,f=>{const g=G(f,2);g(4,5,9,4);g(1,3,4,4);g(0,5,2,1);g(13,6,5,2);g(14,8,4,1);if(n===0){g(6,0,2,5);g(8,1,3,4)}else if(n===1){g(6,3,7,2)}else{g(6,9,2,4);g(8,9,3,3)}});for(let j=8;j<10;j++)for(let i=4;i<6;i++)s.m[j*36+i]=0;return fin(s)};
const SP={dino:[fin(dn(LA)),fin(dn(LB))],duck:[fin(squash(dn(LA))),fin(squash(dn(LB)))],
cac:[fin(rects(24,36,f=>cact(G(f,1.5),0,24,-1,6))),fin(rects(24,51,f=>cact(G(f,1.5),0,34,8,14))),fin(rects(51,42,f=>{cact(G(f,1.5),0,28,-1,7);cact((x,y,a,b)=>G(f,1.5)(x,y+6,a,b),18,22,5,-1)}))],crow:[crow(0),crow(1),crow(2)]};
const LANE=[3,26,56],FR=[0,1,2,1],HST=[];
const THM=[[[20,20,19],[20,20,19],[20,20,19]],[[255,92,138],[60,199,154],[108,99,255]],[[30,136,229],[0,168,150],[57,73,171]],[[255,112,67],[171,71,188],[92,107,192]],[[67,160,71],[124,179,66],[109,76,65]],[[249,168,37],[38,166,154],[69,90,100]]];
const tint=()=>{const T=THM[P.th|0]||THM[0];[[SP.dino,T[0]],[SP.duck,T[0]],[SP.cac,T[1]],[SP.crow,T[2]]].forEach(([a,c])=>a.forEach(o=>fin(o,c)))};tint();
/* ---------- world / state ---------- */
const GRAV=945,JV=344,STEP=1/120,HX=34,H0=64;
let st='home',S=1,vw=230,vh=176,gy=130,dpr=1,clk=0,time=0,dist=0,speed=135,scroll=0,score=0,since=0,gap=0,obs=[],skyT=0,sky=0,wt=0,nextM=100,sim=0,land=0;
const D={x:HX,dy:0,vy:0,drag:0,duck:0,pid:-1};
const spd=()=>Math.min(324,135+time*1.9)*(land&&P.rot?1.4:1);
function size(){dpr=Math.min(devicePixelRatio||1,4);const z=P.zoom,w=innerWidth,h=innerHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);land=w>h*1.1?1:0;S=Math.max(1,Math.round(land?Math.max(cv.height/(250/z),cv.width/(420/z)):cv.width/(230/z)));vw=cv.width/S;vh=cv.height/S;gy=Math.round(vh*(land?.74:.72))}
const hs=n=>{n=Math.imul(n^n>>>15,2246822519);n=Math.imul(n^n>>>13,3266489917);return(n^n>>>16)>>>0};
const dspr=s=>(s.duck?SP.duck:SP.dino)[s.dy>0?0:((s.time*11)|0)%2];
const curSpr=()=>dspr({duck:D.duck,dy:D.dy,time});
const osp=(o,t)=>o.k<3?SP.cac[o.k]:SP.crow[FR[((t*10)|0)%4]];
const oy=(o,s)=>o.k<3?gy-s.h:gy-LANE[o.l]-s.h;
function hit(a,ax,ay,b,bx,by){const x0=Math.max(ax,bx),x1=Math.min(ax+a.w,bx+b.w),y0=Math.max(ay,by),y1=Math.min(ay+a.h,by+b.h);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)if(a.m[(y-ay)*a.w+x-ax]&&b.m[(y-by)*b.w+x-bx])return 1;return 0}
function phys(d,dt){if(!d.drag&&(d.dy>0||d.vy>0)){d.vy-=GRAV*(d.duck?2.2:1)*dt;d.dy+=d.vy*dt;if(d.dy<=0){d.dy=0;d.vy=0}}}
/* ---------- audio: tap blip + synthesized warm guitar loop (Karplus-Strong, fully offline) ---------- */
let AC,mg,mI=0,mOn=0,mN=0,mS=0,mT0=0,TR=null,kc={};
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
